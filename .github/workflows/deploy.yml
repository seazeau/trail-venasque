name: Deploy Trail de Venasque to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-trail-venasque
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Prepare static files
        run: |
          mkdir -p _deploy
          cp index.html gpx_data.js poster-trail-de-venasque-2027.png \
             favicon.svg favicon.ico apple-touch-icon.png \
             image_f67662.jpg venasque1.jpg venasque2.jpg venasque3.jpg \
             logo_foyer_laique.png logo_papa_team_running.png logo_running_conseil.png \
             VENASQUE_2027_*.gpx _deploy/

      - name: 🔐 Vérification des secrets FTP
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_HOST }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_USER }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "❌ Secrets manquants : configurez HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER et HOSTINGER_FTP_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: 🚀 Deploy to Hostinger via FTP
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
          HOSTINGER_FTP_SECURE: ${{ secrets.HOSTINGER_FTP_SECURE }}
        run: |
          npm install --no-save basic-ftp
          node .github/scripts/deploy-ftp.mjs
